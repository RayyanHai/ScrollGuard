name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - name: Build and verify both downloads
        run: python scripts/package-release.py
      - name: Install browser test runtime
        if: runner.os != 'Linux'
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Extract this platform's release download
        if: runner.os != 'Linux'
        run: python -c "import os, pathlib, zipfile; zipfile.ZipFile(next(pathlib.Path('dist').glob('*-' + os.environ['RUNNER_OS'].lower() + '.zip'))).extractall('dist/smoke-extension')"
      - name: Test packaged extension in Chromium
        if: runner.os != 'Linux'
        run: node scripts/browser-smoke.js
        env:
          SCROLLGUARD_EXTENSION_PATH: ${{ github.workspace }}/dist/smoke-extension
      - name: Save browser screenshots
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
