name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package Windows and macOS downloads
        run: python scripts/package-release.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ScrollGuard ${{ github.ref_name }} — Windows and macOS
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/scrollguard-${{ github.ref_name }}-windows.zip
            dist/scrollguard-${{ github.ref_name }}-macos.zip
            dist/SHA256SUMS.txt
