<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScrollGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- First-time setup view. Replaces the entire dashboard until the user
       sets an unlock password. Toggled in popup.js based on userConfig. -->
  <div id="setupView" hidden>
    <header>
      <div class="brand">ScrollGuard</div>
    </header>
    <section class="setup">
      <h1 class="setup-title">Welcome</h1>
      <p class="setup-sub">
        Set your unlock password before you start. You'll type this on the block screen to buy a short grace window.
        Make it memorable, but annoying enough that you have to pause and think.
      </p>
      <div class="field-stack">
        <label for="setupPw">New password</label>
        <input type="password" id="setupPw" autocomplete="new-password" placeholder="at least 4 characters">
      </div>
      <div class="field-stack">
        <label for="setupPwConfirm">Confirm password</label>
        <input type="password" id="setupPwConfirm" autocomplete="new-password" placeholder="type it again">
      </div>
      <div class="actions">
        <button id="setupSave" class="primary">Save and continue</button>
        <span id="setupMsg" class="msg"></span>
      </div>
    </section>
  </div>

  <!-- Normal dashboard. Hidden until setup is complete. -->
  <div id="mainView" hidden>
  <header>
    <div class="brand">ScrollGuard</div>
    <div class="date" id="date"></div>
  </header>

  <section>
    <h2>Today</h2>
    <div id="groups"></div>
    <div class="meta" id="meta"></div>
  </section>

  <section>
    <h2>
      Settings
      <button class="link" id="toggleSettings" aria-expanded="false">edit</button>
    </h2>
    <div id="settingsBody" hidden>
      <div class="row">
        <label for="lim-scroll">Scroll <span class="muted">(feed + stories)</span></label>
        <span class="val" id="lim-scroll-val"></span>
        <input type="range" id="lim-scroll" min="0.5" max="15" step="0.5">
      </div>
      <div class="row">
        <label for="lim-reels">Reels</label>
        <span class="val" id="lim-reels-val"></span>
        <input type="range" id="lim-reels" min="0.5" max="15" step="0.5">
      </div>
      <div class="row">
        <label for="lim-other">Other <span class="muted">(explore, profile)</span></label>
        <span class="val" id="lim-other-val"></span>
        <input type="range" id="lim-other" min="0.5" max="15" step="0.5">
      </div>
      <div class="row">
        <label for="cooldown">Block cooldown</label>
        <span class="val" id="cooldown-val"></span>
        <input type="range" id="cooldown" min="0.5" max="120" step="0.5">
      </div>
      <div class="row">
        <label for="grace">Unlock grace</label>
        <span class="val" id="grace-val"></span>
        <input type="range" id="grace" min="0.5" max="15" step="0.5">
      </div>

      <div class="divider"></div>

      <div class="field-stack">
        <label for="curPw">Current password</label>
        <input type="password" id="curPw" autocomplete="off" placeholder="required to change password">
      </div>
      <div class="field-stack">
        <label for="newPw">New password</label>
        <input type="password" id="newPw" autocomplete="new-password" placeholder="leave blank to keep">
      </div>

      <div class="actions">
        <button id="save" class="primary">Save</button>
        <span id="msg" class="msg"></span>
      </div>
    </div>
  </section>

  <section class="footer-actions">
    <button class="ghost danger" id="lockNow">Lock me now</button>
    <button class="ghost" id="resetToday">Reset today</button>
  </section>
  </div><!-- /mainView -->

  <script src="../lib/classifier.js"></script>
  <script src="../lib/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
